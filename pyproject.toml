[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "remory-runtime"
version = "0.2.0"
description = "Residual memory at the compaction boundary: inference and harness interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.24", "httpx>=0.27,<1"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
transformers = ["torch>=2.9", "transformers==5.3.0", "safetensors>=0.6", "huggingface-hub>=0.34", "accelerate>=1"]
test = ["pytest>=8", "fastapi>=0.115,<1", "ruff>=0.9"]

[project.scripts]
remory = "remory.cli:main"

[project.urls]
Repository = "https://github.com/1ring2rta/Remory"
Weights = "https://huggingface.co/mocoV3/Qwen3.8-27B-REMORY-1.9B"

[tool.hatch.build.targets.wheel]
packages = ["src/remory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
